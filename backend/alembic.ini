# Alembic configuration for Hardware Billing OS.
#
# The database URL is NOT stored here: env.py reads it from app.core.config.settings
# (DATABASE_URL environment variable / .env), the same source the API server uses.
#
# Usage (run from the backend/ directory):
#   alembic upgrade head                 # create / migrate the schema (enables RLS on PostgreSQL)
#   alembic stamp 0001_baseline          # mark a DB created earlier by init_db() as the baseline,
#   alembic upgrade head                 #   then apply the newer migrations

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
